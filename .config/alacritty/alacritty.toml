
[font]
size = 16.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[window]
# macOS: send Alt/Meta instead of composing chars (é, ≤, …).
# Switch to "OnlyRight" if you want the left Option back for typing special chars.
option_as_alt = "Both"
decorations = "buttonless"
opacity = 0.9
blur = true
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 10
y = 10

[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
chars = "\u001b[99~"

