
[font]
size = 18.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[window]
decorations = "buttonless"
opacity = 1
blur = true
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 10
y = 10

[general]
import = ["~/.config/alacritty/everblush.toml"]

[env]
TERM = "xterm-256color"

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
chars = "\u001b[99~"
